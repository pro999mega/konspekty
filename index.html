<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои конспекты</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#eaf2ff;line-height:1.5;
    background:
      radial-gradient(900px 520px at 12% -12%,rgba(79,124,255,.38) 0%,rgba(8,19,38,0) 62%),
      radial-gradient(760px 480px at 100% 2%,rgba(122,84,255,.26) 0%,rgba(8,19,38,0) 58%),
      linear-gradient(165deg,#071224 0%,#0e1f3d 46%,#091731 100%);
    background-attachment:fixed}
  .hd{position:sticky;top:0;z-index:10;padding:14px 12px 8px}
  .card{max-width:830px;margin:0 auto;border-radius:28px;padding:18px 20px 16px;
    background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 22px 48px rgba(0,0,0,.44),inset 0 1px 0 rgba(255,255,255,.18)}
  .kicker{margin:0 0 6px;font-size:10.5px;letter-spacing:2.6px;text-transform:uppercase;color:#8fb6f0}
  h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px;color:#fff}
  .sub{margin:5px 0 0;font-size:12.5px;color:#a9c2e6}
  .tabs{display:flex;gap:9px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;cursor:pointer;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;
    padding:10px 18px;border-radius:999px;color:#dfeaff;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
    transition:transform .18s ease,background .2s ease,color .2s ease}
  .tab:active{transform:scale(.96)}
  .tab.active{background:linear-gradient(135deg,#ffffff,#e6efff);color:#12305f;border-color:rgba(255,255,255,.9);
    box-shadow:0 10px 22px rgba(0,0,0,.36)}
  main{max-width:830px;margin:0 auto;padding:10px 12px 40px}
  .frame{width:100%;border:1px solid rgba(255,255,255,.14);display:block;background:#fff;border-radius:28px;
    box-shadow:0 26px 60px rgba(0,0,0,.46)}
  .links{margin-top:14px;text-align:center;font-size:12px;color:#9db4d6}
  .links a{color:#9ec8ff;text-decoration:none;font-weight:600}
  .foot{max-width:830px;margin:16px auto 0;text-align:center;font-size:11px;color:#6f86a8;letter-spacing:.3px}
  @media(max-width:430px){
    .hd{padding:10px 9px 6px}
    .card{border-radius:22px;padding:14px 15px 13px}
    h1{font-size:17px}
    .frame{border-radius:22px}
  }
</style>
</head>
<body>
  <header class="hd">
    <div class="card">
      <p class="kicker">Личный сборник</p>
      <h1>📚 Мои конспекты</h1>
      <p class="sub" id="sub"></p>
      <div class="tabs" id="tabs"></div>
    </div>
  </header>

  <main>
    <iframe class="frame" id="f" title="Конспект"></iframe>
    <div class="links" id="links"></div>
    <p class="foot">Вкладки появляются только для файлов, которые реально есть в репозитории</p>
  </main>

<script>
  /* В этот список добавляем ТОЛЬКО те файлы,
     которые реально лежат в репозитории. */
  var materials = [
    { src: 'elektrichestvo.html', tab: '⚡ Электричество', short: 'электричество' }
  ];

  var VER = '5'; /* версия ссылок — пробивает кэш, чтобы не показывалась старая копия */

  var frame = document.getElementById('f');
  var tabsBox = document.getElementById('tabs');
  var linksBox = document.getElementById('links');
  var sub = document.getElementById('sub');

  materials.forEach(function (m, i) {
    var b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.textContent = m.tab;
    b.onclick = function () {
      Array.prototype.forEach.call(tabsBox.children, function (x) {
        x.classList.toggle('active', x === b);
      });
      frame.style.height = '60vh';
      frame.src = m.src + '?v=' + VER;
      setTimeout(fit, 500);
    };
    tabsBox.appendChild(b);
  });

  sub.textContent = 'Материалов: ' + materials.length +
    (materials.length === 1 ? ' — ' + materials[0].short : '');

  /* Один конспект — панель выбора не нужна */
  if (materials.length < 2) {
    tabsBox.style.display = 'none';
  } else {
    linksBox.innerHTML = 'Открыть отдельно: ' + materials.map(function (m) {
      return '<a href="' + m.src + '?v=' + VER + '">' + m.short + '</a>';
    }).join(' · ');
  }

  if (materials.length) { frame.src = materials[0].src + '?v=' + VER; }

  function fit() {
    try {
      var d = frame.contentDocument;
      if (d && d.documentElement) {
        var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0, 700);
        frame.style.height = (h + 8) + 'px';
      }
    } catch (e) { frame.style.height = '90vh'; }
  }

  frame.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  setInterval(fit, 900);
</script>
</body>
</html>
