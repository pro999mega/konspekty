<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои конспекты</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2437;line-height:1.5;
    background:radial-gradient(1100px 560px at 12% -12%,#dbe9ff 0%,#eef2f9 46%,#e7ebf4 100%)}
  .hd{position:sticky;top:0;z-index:10;padding:13px 11px 8px}
  .card{max-width:800px;margin:0 auto;color:#fff;border-radius:24px;padding:15px 17px 13px;
    background:linear-gradient(135deg,#1f3b8f 0%,#2f66c9 55%,#3f8ae0 100%);
    box-shadow:0 14px 32px rgba(31,59,143,.30)}
  h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.2px}
  .sub{margin:3px 0 0;font-size:12px;color:#cfe0ff}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-top:11px;padding-bottom:2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;cursor:pointer;font:inherit;font-size:13px;font-weight:600;white-space:nowrap;
    padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.42);
    background:rgba(255,255,255,.14);color:#eaf2ff;transition:transform .15s,background .2s}
  .tab:active{transform:scale(.97)}
  .tab.active{background:#fff;color:#1f3b8f;border-color:#fff;box-shadow:0 5px 14px rgba(0,0,0,.20)}
  main{max-width:800px;margin:0 auto;padding:10px 11px 30px}
  .frame{width:100%;border:0;display:block;background:#fff;border-radius:24px;
    box-shadow:0 12px 28px rgba(27,36,55,.13)}
  .links{margin-top:13px;text-align:center;font-size:12px;color:#5a6b86}
  .links a{color:#2f66c9;text-decoration:none;font-weight:600}
  @media(max-width:430px){
    .hd{padding:10px 9px 6px}
    .card{border-radius:18px;padding:12px 13px 10px}
    .frame{border-radius:18px}
  }
</style>
</head>
<body>
  <header class="hd">
    <div class="card">
      <h1>📚 Мои конспекты</h1>
      <p class="sub" id="sub"></p>
      <div class="tabs" id="tabs"></div>
    </div>
  </header>

  <main>
    <iframe class="frame" id="f" title="Конспект"></iframe>
    <div class="links" id="links"></div>
  </main>

<script>
  /* В этот список добавляем ТОЛЬКО те файлы,
     которые реально лежат в репозитории. */
  var materials = [
    { src: 'elektrichestvo.html', tab: '⚡ Электричество', short: 'электричество' }
  ];

  var VER = '4'; /* версия — чтобы браузер не показывал старую копию из кэша */

  var frame = document.getElementById('f');
  var tabsBox = document.getElementById('tabs');
  var linksBox = document.getElementById('links');
  var sub = document.getElementById('sub');

  materials.forEach(function (m, i) {
    var b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' active' : '');
    b.textContent = m.tab;
    b.onclick = function () {
      Array.prototype.forEach.call(tabsBox.children, function (x) {
        x.classList.toggle('active', x === b);
      });
      frame.style.height = '50vh';
      frame.src = m.src + '?v=' + VER;
      setTimeout(fit, 500);
    };
    tabsBox.appendChild(b);
  });

  sub.textContent = 'Материалов: ' + materials.length +
    (materials.length === 1 ? ' — ' + materials[0].short : '');

  /* Один конспект — панель выбора не нужна */
  if (materials.length < 2) {
    tabsBox.style.display = 'none';
    document.getElementById('links').style.display = 'none';
  } else {
    linksBox.innerHTML = 'Открыть отдельно: ' + materials.map(function (m) {
      return '<a href="' + m.src + '?v=' + VER + '">' + m.short + '</a>';
    }).join(' · ');
  }

  if (materials.length) { frame.src = materials[0].src + '?v=' + VER; }

  function fit() {
    try {
      var d = frame.contentDocument;
      if (d && d.documentElement) {
        var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0, 700);
        frame.style.height = (h + 8) + 'px';
      }
    } catch (e) { frame.style.height = '90vh'; }
  }

  frame.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  setInterval(fit, 900);
</script>
</body>
</html>
