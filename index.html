<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои конспекты</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #eef1f6;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1f2933; line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #1e3a8a; padding: 10px 12px 9px;
    box-shadow: 0 3px 12px rgba(0,0,0,.18);
  }
  h1 { margin: 0 0 8px; font-size: 16px; color: #fff; font-weight: 600; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .tab {
    flex: 0 0 auto; cursor: pointer;
    border: 1px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12); color: #dbeafe;
    font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 7px;
    white-space: nowrap;
  }
  .tab.active { background: #fff; color: #1e3a8a; font-weight: 600; border-color: #fff; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 14px 12px 26px; }
  iframe { width: 100%; border: 0; display: block; background: #fff; border-radius: 10px; }
  .links { margin-top: 14px; font-size: 12px; color: #52647c; text-align: center; }
  .links a { color: #2563eb; }
</style>
</head>
<body>
  <header>
    <h1>📚 Мои конспекты — всё в одном месте</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-src="elektrichestvo.html">⚡ Электричество</button>
      <button class="tab" data-src="magnitny-puskatel.html">🔧 Магнитный пускатель</button>
      <button class="tab" data-src="trehfazny-tok.html">🔌 Трёхфазный ток</button>
      <button class="tab" data-src="istoriya-ot-rusi-do-ordy.html">🏰 История Руси</button>
    </div>
  </header>

  <div class="wrap">
    <iframe id="f" src="elektrichestvo.html" title="Конспект"></iframe>
    <div class="links">
      Открыть отдельно:
      <a href="elektrichestvo.html">электричество</a> ·
      <a href="magnitny-puskatel.html">пускатель</a> ·
      <a href="trehfazny-tok.html">трёхфазка</a> ·
      <a href="istoriya-ot-rusi-do-ordy.html">история</a>
    </div>
  </div>

<script>
  var frame = document.getElementById('f');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));

  function fit() {
    try {
      var d = frame.contentDocument;
      if (d && d.documentElement) {
        var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0, 700);
        frame.style.height = h + 'px';
      }
    } catch (e) { frame.style.height = '90vh'; }
  }

  tabs.forEach(function (t) {
    t.onclick = function () {
      tabs.forEach(function (x) { x.classList.toggle('active', x === t); });
      frame.src = t.dataset.src;
      setTimeout(fit, 400);
    };
  });

  frame.addEventListener('load', fit);
  window.addEventListener('resize', fit);
  setInterval(fit, 900);
</script>
</body>
</html>
